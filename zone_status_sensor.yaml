blueprint:
  name: Zone Status Sensor (AirTouch)
  description: >
    Read-only status text for a zone dashboard card, explaining in plain
    language what the damper control automation is currently doing and why
    (at target, adjusting, unreachable in current mode, window open, stale
    sensor, or spill zone active).
  domain: template
  source_url: https://claude.ai
  input:
    zone_name:
      name: Zone Name
      description: Used in the entity's friendly name, e.g. "Study"
      selector:
        text:
    room_sensor:
      name: Room Temperature Sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature
    room_sensor_last_seen:
      name: Room Sensor Last Seen (optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    stale_after_minutes:
      name: Stale After (minutes)
      default: 180
      selector:
        number:
          min: 15
          max: 1440
          unit_of_measurement: minutes
    target_temp:
      name: Target Temperature Helper
      selector:
        entity:
          domain: input_number
    master_climate:
      name: Master AC Climate Entity
      selector:
        entity:
          domain: climate
    window_sensors:
      name: Window/Door Sensors (optional)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    spill_sensor:
      name: Spill Zone Indicator (optional)
      default: ""
      selector:
        entity:
          domain: binary_sensor
    zone_enabled:
      name: Zone Enabled Toggle
      description: The input_boolean representing whether this zone should be conditioned at all.
      selector:
        entity:
          domain: input_boolean

variables:
  zone_name: !input zone_name
  room_sensor: !input room_sensor
  room_sensor_last_seen: !input room_sensor_last_seen
  stale_after_minutes: !input stale_after_minutes
  target_temp: !input target_temp
  master_climate: !input master_climate
  window_sensors: !input window_sensors
  spill_sensor: !input spill_sensor
  zone_enabled: !input zone_enabled

sensor:
  name: "{{ zone_name }} Aircon Status"
  icon: mdi:information-outline
  state: >-
    {% set current = states(room_sensor) | float(0) %}
    {% set target = states(target_temp) | float(0) %}
    {% set master_action = state_attr(master_climate, 'hvac_action') %}
    {% set zone_is_enabled = is_state(zone_enabled, 'on') %}
    {% set any_window_open = window_sensors | length > 0 and
         expand(window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 %}
    {% set spill_active = spill_sensor != '' and is_state(spill_sensor, 'on') %}
    {% set last_seen_state = states(room_sensor_last_seen) if room_sensor_last_seen != '' else none %}
    {% set last_seen_dt = (last_seen_state | as_datetime) if last_seen_state not in [none, 'unknown', 'unavailable'] else none %}
    {% set is_stale = last_seen_dt is not none and
         (now() - last_seen_dt).total_seconds() > (stale_after_minutes | float * 60) %}
    {% if spill_active %}
      Spill zone active — AirTouch controlling directly
    {% elif not zone_is_enabled %}
      Off — zone disabled
    {% elif any_window_open %}
      Off — window open
    {% elif is_stale %}
      Off — sensor not reporting
    {% elif master_action == 'cooling' and target > current %}
      Can't reach target — cooling active house-wide
    {% elif master_action == 'heating' and target < current %}
      Can't reach target — heating active house-wide
    {% elif master_action not in ['heating', 'cooling'] %}
      Idle — AC not heating/cooling
    {% elif (current - target) | abs < 0.3 %}
      At target
    {% else %}
      {{ master_action | capitalize }} to {{ target }}°C
    {% endif %}
