blueprint:
  name: Light Occupancy Control (Darkness-Gated)
  description: >
    Light only turns on for occupancy while the "is dark" sensor reads
    true at that moment — is_dark_sensor is checked purely as a
    condition, it is not a trigger. It does not catch up if darkness
    begins mid-occupancy, and it never snaps the light off just because
    it becomes light while the room is occupied — occupancy clearing via
    light_off_timer is the only way the light turns off. This is
    deliberate: letting is_dark_sensor act as a trigger created a
    dangerous race where the light itself (turning on) could influence
    a poorly-sited darkness sensor, causing the automation to
    immediately react to its own side-effect and cycle the light off
    again — a real incident on a stairwell where a light sensor picked
    up the rail LED's own glow. Off timing (light_off_timer) starts
    only if the light is actually on, since it's a no-op otherwise.
    Duration is set on the timer helper entity itself.
    Whenever the light turns off, every light in the nominated area is
    swept off too — not just light_switch — so lights the occupant
    turned on manually don't get left orphaned, except any carrying the
    "Occupancy Control Off Excluded" label, which this blueprint leaves
    untouched. The "occupancy cleared" trigger has an optional debounce
    to filter momentary sensor drop-outs — leave it at 0 if your sensor
    already has its own absence-delay setting.
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/blob/main/light_occupancy_control_dark_gated.yaml
  input:
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    is_dark_sensor:
      name: Is dark sensor
      description: Binary sensor that is "on"/true when it's dark enough to want the light.
      selector:
        entity:
          domain: binary_sensor
    light_switch:
      name: Light switch
      description: Light entity for the room's main light.
      selector:
        entity:
          domain: light
    area:
      name: Area to sweep on exit
      description: >
        Whenever the light turns off, every light entity in this area is
        turned off except those carrying the "Occupancy Control Off
        Excluded" label — this catches lights the occupant turned on
        manually that aren't the nominated light_switch. Label any light
        you want this automation to leave alone.
      selector:
        area: {}
    light_off_timer:
      name: Light-off delay timer
      description: Starts when occupancy clears; on finish, light turns off.
      selector:
        entity:
          domain: timer
    occupancy_clear_debounce:
      name: Occupancy-cleared debounce
      description: >
        Ignore momentary occupancy drop-outs shorter than this before
        treating the room as vacated. Only applies to the "occupancy
        cleared" trigger — occupancy detected still reacts instantly.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
          mode: box

mode: queued
max: 10

trigger:
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupancy_on
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    for:
      seconds: !input occupancy_clear_debounce
    id: occupancy_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input light_off_timer
    id: light_off_timer_finished

condition: []

variables:
  area: !input area

action:
  - choose:
      # --- Occupancy detected: turn light on only if it's dark ---
      - conditions:
          - condition: trigger
            id: occupancy_on
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - if:
              - condition: state
                entity_id: !input is_dark_sensor
                state: "on"
            then:
              - action: light.turn_on
                target:
                  entity_id: !input light_switch

      # --- Occupancy cleared: start off-timer only if the light is actually on ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - if:
              - condition: state
                entity_id: !input light_switch
                state: "on"
            then:
              - action: timer.start
                target:
                  entity_id: !input light_off_timer

      # --- Light-off timer elapsed: sweep the area, excluding labeled lights ---
      - conditions:
          - condition: trigger
            id: light_off_timer_finished
        sequence:
          - action: light.turn_off
            target:
              entity_id: >
                {{ area_entities(area) | select('match', '^light\.')
                   | reject('in', label_entities('Occupancy Control Off Excluded'))
                   | list }}
