blueprint:
  name: Light Occupancy Control (Darkness-Gated)
  description: >
    Light only turns on for occupancy while the "is dark" sensor is true.
    Off timing (light_off_timer) is unaffected by darkness — once the light
    is on, it turns off N minutes after occupancy clears regardless of
    daylight, since a delayed light on the way out is undesirable either way.
    If darkness becomes true while the room is already occupied (e.g. an
    overcast change, or a shower steaming up a window), the light turns on
    at that point too — it isn't a one-off check at the entry trigger.
    Duration is set on the timer helper entity itself. The "occupancy
    cleared" trigger has an optional debounce to filter momentary sensor
    drop-outs — leave it at 0 if your sensor already has its own
    absence-delay setting (e.g. FP300's absence_delay_timer).
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/blob/main/light_occupancy_control_dark_gated.yaml
  input:
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    is_dark_sensor:
      name: Is dark sensor
      description: Binary sensor that is "on"/true when it's dark enough to want the light.
      selector:
        entity:
          domain: binary_sensor
    light_switch:
      name: Light switch
      selector:
        entity:
          domain: switch
    light_off_timer:
      name: Light-off delay timer
      description: Starts when occupancy clears; on finish, light turns off.
      selector:
        entity:
          domain: timer
    occupancy_clear_debounce:
      name: Occupancy-cleared debounce
      description: >
        Ignore momentary occupancy drop-outs shorter than this before
        treating the room as vacated. Only applies to the "occupancy
        cleared" trigger — occupancy detected still reacts instantly.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
          mode: box

mode: queued
max: 10

trigger:
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupancy_on
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    for:
      seconds: !input occupancy_clear_debounce
    id: occupancy_off
  - trigger: state
    entity_id: !input is_dark_sensor
    to: "on"
    id: became_dark
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input light_off_timer
    id: light_off_timer_finished

condition: []

action:
  - choose:
      # --- Occupancy detected: turn light on only if it's dark ---
      - conditions:
          - condition: trigger
            id: occupancy_on
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - if:
              - condition: state
                entity_id: !input is_dark_sensor
                state: "on"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input light_switch

      # --- It became dark while the room is occupied: catch up and turn light on ---
      - conditions:
          - condition: trigger
            id: became_dark
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input light_switch

      # --- Occupancy cleared: start off-timer regardless of darkness ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - action: timer.start
            target:
              entity_id: !input light_off_timer

      # --- Light-off timer elapsed ---
      - conditions:
          - condition: trigger
            id: light_off_timer_finished
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input light_switch
