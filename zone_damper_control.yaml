blueprint:
  name: Zone Damper Control (AirTouch)
  description: >
    Drives an AirTouch zone damper to a percentage open position based on a
    room's own temperature sensor and target, reading the master AC unit's
    live hvac_action (heating/cooling/idle) to determine direction - correctly
    handles heat_cool mode, not just heat/cool. Wakes the master AC (using its
    last_active_hvac_mode) if this zone is enabled and the master has shut
    itself off. Also handles window pause, stale-sensor safety hold, a
    per-zone enabled/disabled toggle, and skips control entirely while the
    zone is acting as the AirTouch spill zone.
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/blob/main/zone_damper_control.yaml
  input:
    room_sensor:
      name: Room Temperature Sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature
    room_sensor_last_seen:
      name: Room Sensor Last Seen (optional)
      description: >
        A datetime/timestamp entity showing when the room sensor last
        reported. Leave unset to disable staleness checking for this zone.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    stale_after_minutes:
      name: Stale After (minutes)
      description: How long since last report before the sensor is treated as stale and the damper is held at its current position.
      default: 180
      selector:
        number:
          min: 15
          max: 1440
          unit_of_measurement: minutes
    damper_cover:
      name: Zone Damper
      selector:
        entity:
          domain: cover
    target_temp:
      name: Target Temperature Helper
      selector:
        entity:
          domain: input_number
    master_climate:
      name: Master AC Climate Entity
      selector:
        entity:
          domain: climate
    window_sensors:
      name: Window/Door Sensors (optional)
      description: One or more contact sensors. Any open for longer than the grace period pauses this zone (damper forced closed).
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    window_grace_minutes:
      name: Window Open Grace Period (minutes)
      description: How long a window/door must stay open before the damper closes. A brief open (letting a pet out, carrying something in) won't trigger it.
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes
    spill_sensor:
      name: Spill Zone Indicator (optional)
      description: If this zone is AirTouch's designated spill zone, provide its binary_sensor. When active, this automation does nothing and lets AirTouch control the damper directly.
      default: ""
      selector:
        entity:
          domain: binary_sensor
    zone_enabled:
      name: Zone Enabled Toggle
      description: The input_boolean representing whether this zone should be conditioned at all. When off, the damper is forced closed and no regulation runs.
      selector:
        entity:
          domain: input_boolean
    gain:
      name: Proportional Gain (%/°C)
      description: Damper percentage change per degree of difference from target. Higher = more aggressive response.
      default: 20
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: "%/°C"
    step:
      name: Damper Step Size
      description: Round calculated position to the nearest multiple of this (AirTouch only accepts 5% increments).
      default: 5
      selector:
        number:
          min: 5
          max: 25
          unit_of_measurement: "%"
    wake_delay_seconds:
      name: Wake Delay Timeout (seconds)
      description: Maximum time to wait for the damper to physically reach its commanded position before turning the master AC on. If it hasn't confirmed by this timeout, the wake proceeds anyway rather than blocking indefinitely.
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds
    wake_cooldown_minutes:
      name: Wake Cooldown (minutes)
      description: Minimum time since the master AC's mode last changed before this zone is allowed to wake it again. Protects the compressor from rapid on/off cycling if conditions are unstable.
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: minutes

trigger:
  - platform: time_pattern
    minutes: "/5"
  - platform: state
    entity_id: !input room_sensor
  - platform: state
    entity_id: !input target_temp
  - platform: state
    entity_id: !input master_climate
    attribute: hvac_action
  - platform: state
    entity_id: !input window_sensors
    to: "on"
    for:
      minutes: !input window_grace_minutes
  - platform: state
    entity_id: !input window_sensors
    to: "off"
  - platform: state
    entity_id: !input zone_enabled

condition: []

action:
  - variables:
      damper_cover: !input damper_cover
      room_sensor: !input room_sensor
      room_sensor_last_seen: !input room_sensor_last_seen
      stale_after_minutes: !input stale_after_minutes
      target_temp: !input target_temp
      master_climate: !input master_climate
      window_sensors: !input window_sensors
      window_grace_minutes: !input window_grace_minutes
      spill_sensor: !input spill_sensor
      zone_enabled: !input zone_enabled
      gain: !input gain
      step: !input step
      wake_cooldown_minutes: !input wake_cooldown_minutes
      current: "{{ states(room_sensor) | float(0) }}"
      target: "{{ states(target_temp) | float(0) }}"
      current_invalid: "{{ (states(room_sensor) | float(none)) is none }}"
      target_invalid: "{{ (states(target_temp) | float(none)) is none }}"
      sensor_data_invalid: "{{ current_invalid or target_invalid }}"
      master_action: "{{ state_attr(master_climate, 'hvac_action') }}"
      zone_is_enabled: "{{ is_state(zone_enabled, 'on') }}"
      master_is_off: "{{ states(master_climate) == 'off' }}"
      is_dry_or_fan_only: "{{ states(master_climate) in ['dry', 'fan_only'] }}"
      any_window_open: >-
        {% set ns = namespace(open_sustained=false) %}
        {% for w in window_sensors %}
          {% if is_state(w, 'on') and (now() - states[w].last_changed).total_seconds() >= (window_grace_minutes | float * 60) %}
            {% set ns.open_sustained = true %}
          {% endif %}
        {% endfor %}
        {{ ns.open_sustained }}
      spill_active: >-
        {{ spill_sensor != '' and is_state(spill_sensor, 'on') }}
      is_stale: >-
        {% set last_seen_state = states(room_sensor_last_seen) if room_sensor_last_seen != '' else none %}
        {% set last_seen_dt = (last_seen_state | as_datetime) if last_seen_state not in [none, 'unknown', 'unavailable'] else none %}
        {{ last_seen_dt is not none and
           (now() - last_seen_dt).total_seconds() > (stale_after_minutes | float * 60) }}
      anticipated_action: >-
        {% if master_action in ['heating', 'cooling'] %}
          {{ master_action }}
        {% else %}
          {% set wake_mode = state_attr(master_climate, 'last_active_hvac_mode') %}
          {% if wake_mode == 'cool' %}
            cooling
          {% elif wake_mode == 'heat' %}
            heating
          {% else %}
            {{ 'cooling' if current > target else 'heating' }}
          {% endif %}
        {% endif %}
      need: >-
        {% if anticipated_action == 'cooling' %}
          {{ current - target }}
        {% elif anticipated_action == 'heating' %}
          {{ target - current }}
        {% else %}
          {{ -100 }}
        {% endif %}
      raw_position: "{{ (gain | float) * (need | float) }}"
      stepped_position: "{{ ((raw_position / step) | round(0) * step) | int }}"
      clamped_position: "{{ [0, [100, stepped_position] | min] | max }}"
      mode_cooldown_elapsed: >-
        {{ (now() - states[master_climate].last_changed).total_seconds()
           >= (wake_cooldown_minutes | float * 60) }}
      will_wake: >-
        {{ zone_is_enabled and master_is_off and not any_window_open
           and not is_stale and not sensor_data_invalid
           and clamped_position > 0 and mode_cooldown_elapsed }}
  - choose:
      # Spill zone: hands off, let AirTouch control it directly
      - conditions: "{{ spill_active }}"
        sequence: []
      # Zone disabled: force closed, no regulation
      - conditions: "{{ not zone_is_enabled }}"
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input damper_cover
            data:
              position: 0
      # Window open: force closed
      - conditions: "{{ any_window_open }}"
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input damper_cover
            data:
              position: 0
      # Stale sensor: hold current position, don't recompute
      - conditions: "{{ is_stale }}"
        sequence: []
      # Bad entity reference (target_temp or room_sensor unresolvable): hold, don't guess
      - conditions: "{{ sensor_data_invalid }}"
        sequence: []
      # Dry or Fan Only: no temperature to chase, leave damper as-is for manual control
      - conditions: "{{ is_dry_or_fan_only }}"
        sequence: []
    default:
      - service: cover.set_cover_position
        target:
          entity_id: !input damper_cover
        data:
          position: "{{ clamped_position }}"
  - if:
      - condition: template
        value_template: "{{ will_wake }}"
    then:
      - wait_template: "{{ state_attr(damper_cover, 'current_position') == clamped_position }}"
        timeout:
          seconds: !input wake_delay_seconds
        continue_on_timeout: true
      - service: climate.set_hvac_mode
        target:
          entity_id: !input master_climate
        data:
          hvac_mode: "{{ state_attr(master_climate, 'last_active_hvac_mode') }}"

mode: single
max_exceeded: silent
