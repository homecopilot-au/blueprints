blueprint:
  name: Light Occupancy Control (Darkness-Gated) With Master
  description: >
    Same logic as Light Occupancy Control (Darkness-Gated): light
    only turns on for occupancy while the "is dark" sensor is true, and
    turns off immediately if it becomes light — regardless of occupancy
    state. If darkness begins while the stairs are already occupied, the
    light turns on at that point too, not just at the entry trigger.
    Off timing on the occupancy side (light_off_timer) is unaffected by
    darkness — once on, it turns off N minutes after occupancy clears as
    normal; the timer only starts if the light is actually on.
    Difference from the bathroom version: the light is a Shelly RGBW
    controller (light_switch) that sits behind a separate master power
    switch. Whenever the light needs to turn on, the master switch is
    turned on first (only if it's currently off), followed by a short
    delay to let the Shelly boot before the light switch command is sent.
    The master switch is left on when the light turns off, whether by
    timer or by daylight — this blueprint never powers it back down.
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/blob/main/light_occupancy_control_dark_gated_with_master.yaml
  input:
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    is_dark_sensor:
      name: Is dark sensor
      description: Binary sensor that is "on"/true when it's dark enough to want the light.
      selector:
        entity:
          domain: binary_sensor
    master_power_switch:
      name: Master power switch
      description: >
        Switch controlling power to the Shelly RGBW controller. Turned on
        first (if off) whenever the light needs to come on, with a short
        delay before the light switch command.
      selector:
        entity:
          domain: switch
    power_on_delay:
      name: Power-on delay
      description: >
        Seconds to wait after turning on the master power switch before
        sending the light-on command, to let the Shelly boot.
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: seconds
          mode: box
    light_switch:
      name: Light switch (Shelly RGBW controller)
      selector:
        entity:
          domain: switch
    light_off_timer:
      name: Light-off delay timer
      description: Starts when occupancy clears; on finish, light turns off.
      selector:
        entity:
          domain: timer
    occupancy_clear_debounce:
      name: Occupancy-cleared debounce
      description: >
        Ignore momentary occupancy drop-outs shorter than this before
        treating the stairs as vacated. Only applies to the "occupancy
        cleared" trigger — occupancy detected still reacts instantly.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
          mode: box

mode: queued
max: 10

trigger:
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupancy_on
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    for:
      seconds: !input occupancy_clear_debounce
    id: occupancy_off
  - trigger: state
    entity_id: !input is_dark_sensor
    to: "on"
    id: became_dark
  - trigger: state
    entity_id: !input is_dark_sensor
    to: "off"
    id: became_light
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input light_off_timer
    id: light_off_timer_finished

condition: []

action:
  - choose:
      # --- Occupancy detected: turn light on only if it's dark ---
      - conditions:
          - condition: trigger
            id: occupancy_on
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - if:
              - condition: state
                entity_id: !input is_dark_sensor
                state: "on"
            then:
              - if:
                  - condition: state
                    entity_id: !input master_power_switch
                    state: "off"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: !input master_power_switch
                  - delay:
                      seconds: !input power_on_delay
              - action: switch.turn_on
                target:
                  entity_id: !input light_switch

      # --- It became dark while occupied: ensure power, then turn light on ---
      - conditions:
          - condition: trigger
            id: became_dark
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
        sequence:
          - if:
              - condition: state
                entity_id: !input master_power_switch
                state: "off"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input master_power_switch
              - delay:
                  seconds: !input power_on_delay
          - action: switch.turn_on
            target:
              entity_id: !input light_switch

      # --- It became light: turn off immediately, regardless of occupancy ---
      - conditions:
          - condition: trigger
            id: became_light
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - action: switch.turn_off
            target:
              entity_id: !input light_switch

      # --- Occupancy cleared: start off-timer only if the light is actually on ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - if:
              - condition: state
                entity_id: !input light_switch
                state: "on"
            then:
              - action: timer.start
                target:
                  entity_id: !input light_off_timer

      # --- Light-off timer elapsed ---
      - conditions:
          - condition: trigger
            id: light_off_timer_finished
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input light_switch
