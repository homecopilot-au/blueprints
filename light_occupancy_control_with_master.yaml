blueprint:
  name: Light Occupancy Control With Master
  description: >
    Same logic as Light Occupancy Control: light on immediately on
    occupancy, off N minutes after clear (light_off_timer). Duration is set
    on the timer helper entity itself. On the off trigger, every light in
    the nominated area is turned off (not just light_switch) so lights
    turned on manually don't get left orphaned — except any carrying the
    "Occupancy Control Off Excluded" label, which this blueprint leaves
    untouched.
    Difference: the light sits behind a separate master power switch (e.g.
    a Shelly-style controller that needs its own power switch turned on
    before it'll respond). Whenever the light needs to turn on, the master
    switch is turned on first (only if it's currently off), followed by a
    short delay to let the controller boot/re-establish power before the
    light command is sent. The master switch is left on when the light
    turns off — this blueprint never powers it back down — since the goal
    is just to guarantee the controller is ready to receive commands when
    needed, not to manage the power switch generally.
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/edit/main/light_occupancy_control_with_master.yaml
  input:
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    master_power_switch:
      name: Master power switch
      description: >
        Switch controlling power to the light controller. Turned on
        first (if off) whenever the light needs to come on, with a short
        delay before the light switch command.
      selector:
        entity:
          domain: switch
    power_on_delay:
      name: Power-on delay
      description: >
        Seconds to wait after turning on the master power switch before
        sending the light-on command, to let the controller boot.
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: seconds
          mode: box
    light_switch:
      name: Light switch
      description: Light entity for the controller output.
      selector:
        entity:
          domain: light
    area:
      name: Area to sweep on exit
      description: >
        On the light-off trigger, every light entity in this area is turned
        off except those carrying the "Occupancy Control Off Excluded"
        label — this catches lights turned on manually that aren't the
        nominated light_switch. Label any light you want this automation
        to leave alone.
      selector:
        area: {}
    light_off_timer:
      name: Light-off delay timer
      description: Starts when occupancy clears; on finish, light turns off.
      selector:
        entity:
          domain: timer
    occupancy_clear_debounce:
      name: Occupancy-cleared debounce
      description: >
        Ignore momentary occupancy drop-outs shorter than this before
        treating the room as vacated. Only applies to the "occupancy
        cleared" trigger — occupancy detected still reacts instantly.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
          mode: box

mode: queued
max: 10

trigger:
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupancy_on
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    for:
      seconds: !input occupancy_clear_debounce
    id: occupancy_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input light_off_timer
    id: light_off_timer_finished

condition: []

variables:
  area: !input area

action:
  - choose:
      # --- Occupancy detected: ensure power, then turn light on ---
      - conditions:
          - condition: trigger
            id: occupancy_on
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - if:
              - condition: state
                entity_id: !input master_power_switch
                state: "off"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input master_power_switch
              - delay:
                  seconds: !input power_on_delay
          - action: light.turn_on
            target:
              entity_id: !input light_switch

      # --- Occupancy cleared: start off-timer ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - action: timer.start
            target:
              entity_id: !input light_off_timer

      # --- Light-off timer elapsed: sweep the area, excluding labeled lights ---
      - conditions:
          - condition: trigger
            id: light_off_timer_finished
        sequence:
          - action: light.turn_off
            target:
              entity_id: >
                {{ area_entities(area) | select('match', '^light\.')
                   | reject('in', label_entities('Occupancy Control Off Excluded'))
                   | list }}
