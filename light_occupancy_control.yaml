blueprint:
  name: Light Occupancy Control
  description: >
    Light on immediately on occupancy, off N minutes after clear
    (light_off_timer). Duration is set on the timer helper entity itself —
    this blueprint just sequences it. On the off trigger, every light in
    the nominated area is turned off (not just light_switch) so lights the
    occupant turned on manually don't get left orphaned — except any
    carrying the "Occupancy Control Off Excluded" label, which this
    blueprint leaves untouched. The "occupancy cleared" trigger has an
    optional debounce to filter momentary sensor drop-outs (e.g.
    multi-sensor group boundary blips) without delaying the "occupancy
    detected" response. Use the sensor's own absence-delay setting where
    available as the primary fix — this debounce is a backstop, so leave
    it at 0 if the sensor already handles it.
  domain: automation
  source_url: https://github.com/homecopilot-au/blueprints/blob/main/light_occupancy_control.yaml
  input:
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    light_switch:
      name: Light switch
      description: Light entity for the room's main light.
      selector:
        entity:
          domain: light
    area:
      name: Area to sweep on exit
      description: >
        On the light-off trigger, every light entity in this area is turned
        off except those carrying the "Occupancy Control Off Excluded"
        label — this catches lights the occupant turned on manually that
        aren't the nominated light_switch. Label any light you want this
        automation to leave alone.
      selector:
        area: {}
    light_off_timer:
      name: Light-off delay timer
      description: Starts when occupancy clears; on finish, light turns off.
      selector:
        entity:
          domain: timer
    occupancy_clear_debounce:
      name: Occupancy-cleared debounce
      description: >
        Ignore momentary occupancy drop-outs shorter than this before
        treating the room as vacated. Only applies to the "occupancy
        cleared" trigger — occupancy detected still reacts instantly.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
          mode: box

mode: queued
max: 10

trigger:
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupancy_on
  - trigger: state
    entity_id: !input occupancy_sensor
    to: "off"
    for:
      seconds: !input occupancy_clear_debounce
    id: occupancy_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input light_off_timer
    id: light_off_timer_finished

condition: []

variables:
  area: !input area

action:
  - choose:
      # --- Occupancy detected ---
      - conditions:
          - condition: trigger
            id: occupancy_on
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input light_off_timer
          - action: light.turn_on
            target:
              entity_id: !input light_switch

      # --- Occupancy cleared ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - action: timer.start
            target:
              entity_id: !input light_off_timer

      # --- Light-off timer elapsed: sweep the area, excluding labeled lights ---
      - conditions:
          - condition: trigger
            id: light_off_timer_finished
        sequence:
          - action: light.turn_off
            target:
              entity_id: >
                {{ area_entities(area) | select('match', '^light\.')
                   | reject('in', label_entities('Occupancy Control Off Excluded'))
                   | list }}
